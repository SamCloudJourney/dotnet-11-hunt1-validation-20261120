name: Windows benign path normalization
on:
  push:
    paths:
      - '.github/workflows/windows-path-normalization.yml'
      - 'tests/windows-path-normalization/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benign-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - run: dotnet run --project tests/windows-path-normalization/WindowsPathNormalization.csproj --configuration Release
