name: .NET 11 certificate purpose matrix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/x509-eku-platform.yml
      - tests/x509-eku/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chain-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install official .NET 11 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - name: Run generated certificate purpose matrix
        shell: bash
        run: dotnet run --project tests/x509-eku/X509Eku.csproj --configuration Release
